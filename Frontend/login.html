<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | MindForum</title>
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,600;1,6..72,400&display=swap" rel="stylesheet">
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="login.css">
</head>
<body>

<div class="container">
    <div class="header">
        <h1 class="logo">MindForum</h1>
        <p class="tagline">Step into the Intellectual Salon.</p>
    </div>

    <div class="login-box">
        <h2>Welcome back</h2>
        
        <form id="loginForm">
            <div class="form-group">
                <div class="label-container">
                    <label for="email">EMAIL ADDRESS</label>
                </div>
                <input type="email" id="email" placeholder="name@example.com" required autocomplete="email">
            </div>

            <div class="form-group">
                <div class="label-container">
                    <label for="password">PASSWORD</label>
                    <a href="#" class="forgot-link">Forgot?</a>
                </div>
                <input type="password" id="password" placeholder="••••••••" required autocomplete="current-password">
            </div>

            <button type="submit" id="submitBtn">Login to Forum</button>
        </form>

        <div class="footer">
            New to the community? <a href="/signup">Create an account</a>
        </div>
    </div>
</div>

<div class="bottom-section">
    <div class="topics">
        <div class="topic-item">
            <i class="fas fa-brain"></i> PSYCHOLOGY
        </div>
        <div class="topic-item">
            <i class="fas fa-book-open"></i> PHILOSOPHY
        </div>
        <div class="topic-item">
            <i class="fas fa-microscope"></i> SCIENCE
        </div>
    </div>
    <div class="legal-links">
        PRIVACY <span>•</span> TERMS <span>•</span> COMMUNITY GUIDELINES
    </div>
</div>

<script src="login.js"></script>

</body>
</html>
